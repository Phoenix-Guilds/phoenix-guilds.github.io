---
layout: nest-default
title: Гайды
---

<div class="container my-5">
  <div class="text-center mb-5">
    <h1 class="display-3">Полезные Гайды</h1>
    <p class="lead">Опыт и знания игроков гильдии Phoenix Nest</p>
  </div>

  <div class="row justify-content-center">
    {% for guide in site.guides limit:1 %}
    <div class="col-lg-9 shadow-sm p-4 rounded bg-white">
      <h2 class="mb-3">{{ guide.title }}</h2>
      <p class="text-muted small">Автор: {{ guide.author }}</p>
      <div class="mb-4"><strong>Кратко:</strong> {{ guide.description }}</div>
      <div class="guide-preview">
        {{ guide.content }}
      </div>
    </div>
    {% endfor %}
  </div>
</div>
