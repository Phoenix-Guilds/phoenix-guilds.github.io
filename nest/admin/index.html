<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Phoenix Nest</title>

    <link rel="mask-icon" href="https://phoenix-guilds.netlify.app" />
    <link rel="origin" href="https://phoenix-guilds.netlify.app" />
    <meta name="netlify-identity-site-url" content="https://phoenix-guilds.netlify.app" />

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/nest/admin/";
            });
          }
        });

        window.netlifyIdentity.init({
          API_URL: "https://phoenix-guilds.netlify.app/.netlify/identity",
        });
      }
    </script>
  </body>
</html>
