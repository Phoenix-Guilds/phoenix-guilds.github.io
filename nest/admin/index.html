<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager | Phoenix Nest</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      window.addEventListener(
        "message",
        (event) => {
          console.log("Получено сообщение от:", event.origin);
          console.log("Данные:", event.data);

          if (event.data === "authorizing:github:success") {
            console.log("Авторизация успешна! Перезагружаем для входа...");
            setTimeout(() => window.location.reload(), 500);
          }
        },
        false,
      );
    </script>
  </body>
</html>
