<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Phoenix Nest</title>
  </head>
  <body>
    <div id="nc-root"></div>

    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      window.addEventListener(
        "message",
        (event) => {
          if (event.origin === "https://decap-cms-oauth-proxy.vercel.app") {
            if (event.data === "authorizing:github:success") {
              window.location.reload();
            }
          }
        },
        false,
      );
    </script>
  </body>
</html>
