<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Content Manager | Phoenix Nest</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      window.addEventListener(
        "message",
        (event) => {
          if (event.origin === "https://decap-cms-oauth-proxy.vercel.app") {
            console.log("Сигнал получен, обрабатываем токен...");

            if (event.data && event.data.includes("success")) {
              const jsonStr = event.data.replace("authorization:github:success:", "");
              try {
                const data = JSON.parse(jsonStr);
                if (data.token) {
                  const user = {
                    backendName: "github",
                    token: data.token,
                    provider: "github",
                  };
                  localStorage.setItem("decap-cms-user", JSON.stringify(user));
                  localStorage.setItem("netlify-cms-user", JSON.stringify(user));

                  console.log("Токен сохранен! Перезагрузка...");
                  setTimeout(() => {
                    window.location.reload();
                  }, 500);
                }
              } catch (e) {
                console.error("Ошибка парсинга токена:", e);
              }
            }
          }
        },
        false,
      );

      function transliterate(text) {
        const map = {
          а: "a",
          б: "b",
          в: "v",
          г: "g",
          д: "d",
          е: "e",
          ё: "yo",
          ж: "zh",
          з: "z",
          и: "i",
          й: "j",
          к: "k",
          л: "l",
          м: "m",
          н: "n",
          о: "o",
          п: "p",
          р: "r",
          с: "s",
          т: "t",
          у: "u",
          ф: "f",
          х: "h",
          ц: "c",
          ч: "ch",
          ш: "sh",
          щ: "shh",
          ъ: "",
          ы: "y",
          ь: "",
          э: "e",
          ю: "yu",
          я: "ya",
        };
        return text
          .toLowerCase()
          .split("")
          .map((char) => map[char] || char)
          .join("")
          .replace(/[^a-z0-0]/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      CMS.registerEventListener({
        name: "preSave",
        handler: ({ entry }) => {
          const title = entry.getIn(["data", "title"]);
          const currentSlug = entry.getIn(["data", "slug"]);

          if (title && !currentSlug) {
            return entry.setIn(["data", "slug"], transliterate(title));
          }
        },
      });
    </script>
  </body>
</html>
