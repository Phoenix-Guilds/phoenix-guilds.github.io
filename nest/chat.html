<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
  #chat-wrapper {
    display: flex;
    flex-direction: column;
    height: 75vh;
    min-height: 500px;
    background: #1a1d20;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }

  /* Верхняя панель настроек */
  #chat-header {
    background: #121416;
    padding: 10px 15px;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .settings-dropdown {
    position: relative;
    display: inline-block;
  }

  #settings-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 30px;
    background: #2b3035;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px;
    min-width: 200px;
    z-index: 1001;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  }

  .mute-option {
    display: block;
    width: 100%;
    padding: 5px 10px;
    background: none;
    border: none;
    color: #eee;
    text-align: left;
    font-size: 0.8rem;
    cursor: pointer;
    border-radius: 4px;
  }

  .mute-option:hover {
    background: #3d4246;
  }
  .mute-active {
    color: #ffc107 !important;
  }

  #auth-gate {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 19, 0.98);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column-reverse;
    background-image: linear-gradient(rgba(15, 17, 19, 0.9), rgba(15, 17, 19, 0.9)), url("https://www.transparenttextures.com/patterns/dark-matter.png");
  }

  .msg-bubble {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    background: #2b3035;
    color: #eee;
    max-width: 80%;
    align-self: flex-start;
    position: relative;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: background 0.2s;
  }

  .msg-bubble.own {
    align-self: flex-end;
    background: #a9ffd0;
    color: #0b2e13;
    border-bottom-right-radius: 4px;
    min-width: 250px;
  }

  .msg-bubble:not(.own) {
    border-bottom-left-radius: 4px;
    border-left: 3px solid #0dcaf0;
  }

  .msg-info {
    font-size: 0.65rem;
    font-weight: bold;
    margin-bottom: 4px;
    opacity: 0.7;
    padding-right: 40px;
  }

  .msg-actions {
    position: absolute;
    top: 6px;
    right: 8px;
    display: none;
    gap: 5px;
    z-index: 10;
  }

  .msg-bubble:hover .msg-actions {
    display: flex;
  }

  .msg-btn {
    font-size: 0.7rem;
    cursor: pointer;
    background: rgba(0, 0, 0, 0.2);
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  .msg-btn:hover {
    background: #0dcaf0;
    color: white;
  }
  .own .msg-btn:hover {
    background: #0b2e13;
    color: #a9ffd0;
  }

  .reply-quote {
    background: rgba(0, 0, 0, 0.15);
    border-left: 3px solid #0dcaf0;
    padding: 4px 10px;
    margin-bottom: 8px;
    font-size: 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  #reply-preview {
    display: none;
    padding: 8px 15px;
    background: #212529;
    border-top: 1px solid #333;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
  }

  #chat-input-area {
    padding: 15px;
    background: #121416;
    border-top: 1px solid #333;
  }

  #chat-messages::-webkit-scrollbar {
    width: 5px;
  }
  #chat-messages::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 10px;
  }
</style>

<div class="container mt-4">
  <div id="chat-wrapper">
    <div id="chat-header">
      <div class="small text-muted fw-bold">🛡️ ENCRYPTED COMMAND CHANNEL</div>
      <div class="settings-dropdown">
        <button onclick="toggleSettings()" class="btn btn-sm btn-outline-secondary" id="mute-indicator">🔊 Настройки</button>
        <div id="settings-menu">
          <div class="small text-muted mb-2 px-2 border-bottom pb-1">Уведомления:</div>
          <button onclick="setMute(0)" class="mute-option" id="mute-0">🔊 Включить звук</button>
          <button onclick="setMute(5)" class="mute-option" id="mute-5">🔇 На 5 минут</button>
          <button onclick="setMute(15)" class="mute-option" id="mute-15">🔇 На 15 минут</button>
          <button onclick="setMute(30)" class="mute-option" id="mute-30">🔇 На 30 минут</button>
          <button onclick="setMute(60)" class="mute-option" id="mute-60">🔇 На 1 час</button>
          <button onclick="setMute(180)" class="mute-option" id="mute-180">🔇 На 3 часа</button>
          <button onclick="setMute(-1)" class="mute-option" id="mute-forever">🔕 Отключить навсегда</button>
        </div>
      </div>
    </div>

    <div id="auth-gate">
      <div class="p-4 text-center" style="max-width: 320px; width: 100%;">
        <h4 class="mb-3 text-white">Чат гильдии</h4>
        <input type="text" id="user-nick" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="Ваш Ник" />
        <input type="password" id="secret-key" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Пароль" />
        <button onclick="initChat()" class="btn btn-info w-100 fw-bold">Войти</button>
      </div>
    </div>

    <div id="chat-messages"></div>

    <div id="reply-preview">
      <div id="reply-text" class="text-truncate text-muted pr-3"></div>
      <div onclick="cancelAllModes()" style="cursor: pointer;" class="text-danger fw-bold">✕</div>
    </div>

    <div id="chat-input-area">
      <div class="input-group">
        <input type="text" id="msg-field" class="form-control bg-dark text-white border-secondary shadow-none" placeholder="Сообщение..." disabled />
        <button onclick="handleSend()" id="send-btn" class="btn btn-primary px-3" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

<audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>

<script>
  const SUPABASE_URL = "https://aancnktkdjotjbtdjznw.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbmNua3RrZGpvdGpidGRqem53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTE3OTgsImV4cCI6MjA5MTQyNzc5OH0.ZPVyfehHS6KCTKthlc9hv2kzzQX-G28Z3JubWQpteKA";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let myNick = "",
    masterKey = "",
    lastTimestamp = null,
    isLoadedAll = false;
  let replyId = null,
    editingId = null;

  // Логика звука
  function toggleSettings() {
    const menu = document.getElementById("settings-menu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  }

  function setMute(minutes) {
    let until = 0;
    if (minutes === -1) until = 9999999999999;
    // Навсегда
    else if (minutes > 0) until = Date.now() + minutes * 60 * 1000;

    localStorage.setItem("chat_mute_until", until);
    updateMuteUI();
    document.getElementById("settings-menu").style.display = "none";
  }

  function updateMuteUI() {
    const until = parseInt(localStorage.getItem("chat_mute_until") || "0");
    const indicator = document.getElementById("mute-indicator");

    // Сбрасываем активные стили
    document.querySelectorAll(".mute-option").forEach((el) => el.classList.remove("mute-active"));

    if (until > Date.now()) {
      indicator.innerText = until > Date.now() + 10 * 365 * 24 * 60 * 60 * 1000 ? "🔕 Без звука" : "🔇 Мьют активен";
      indicator.classList.replace("btn-outline-secondary", "btn-outline-warning");
    } else {
      indicator.innerText = "🔊 Настройки";
      indicator.classList.replace("btn-outline-warning", "btn-outline-secondary");
      document.getElementById("mute-0").classList.add("mute-active");
    }
  }

  function playNotifSound() {
    const until = parseInt(localStorage.getItem("chat_mute_until") || "0");
    if (Date.now() > until) {
      const sound = document.getElementById("notif-sound");
      sound.currentTime = 0;
      sound.play().catch((e) => console.log("Браузер заблокировал звук до взаимодействия"));
    }
  }

  // Обновим инициализацию
  async function initChat() {
    myNick = document.getElementById("user-nick").value.trim();
    const inputPass = document.getElementById("secret-key").value.trim();
    if (!myNick || !inputPass) return alert("Введите данные!");

    const { data: settings, error } = await client.from("chat_settings").select("*").single();
    if (error) return alert("Ошибка БД");

    const loginHash = CryptoJS.SHA256(inputPass).toString();
    if (loginHash !== settings.password_hash) return alert("Неверный пароль!");

    try {
      const bytes = CryptoJS.AES.decrypt(settings.encrypted_master_key, inputPass);
      masterKey = bytes.toString(CryptoJS.enc.Utf8);
    } catch (e) {
      return alert("Ошибка дешифровки!");
    }

    document.getElementById("auth-gate").style.display = "none";
    document.getElementById("msg-field").disabled = false;
    document.getElementById("send-btn").disabled = false;

    updateMuteUI();
    loadHistory();
    startRealtime();
    setupInfiniteScroll();
  }

  // Остальные функции без изменений, кроме старта Realtime
  async function handleSend() {
    const field = document.getElementById("msg-field");
    const text = field.value.trim();
    if (!text || !masterKey) return;
    const encrypted = CryptoJS.AES.encrypt(text, masterKey).toString();
    if (editingId) {
      await client.from("messages").update({ payload: encrypted, is_edited: true }).eq("id", editingId);
      cancelAllModes();
    } else {
      const { error } = await client.from("messages").insert([{ author: myNick, payload: encrypted, reply_to_id: replyId }]);
      if (!error) {
        field.value = "";
        cancelAllModes();
      }
    }
  }

  function displayMessage(msg, method = "prepend") {
    const container = document.getElementById("chat-messages");
    const existing = document.getElementById(`msg-${msg.id}`);
    if (existing) existing.remove();

    let text = "🔒 Error";
    try {
      const bytes = CryptoJS.AES.decrypt(msg.payload, masterKey);
      text = bytes.toString(CryptoJS.enc.Utf8);
    } catch (e) {}

    const isOwn = msg.author === myNick;
    const cleanText = text.replace(/'/g, "&apos;").replace(/"/g, "&quot;");

    const msgHtml = `
      <div class="msg-bubble ${isOwn ? "own" : ""}" id="msg-${msg.id}">
        <div class="msg-actions">
          <div class="msg-btn" onclick="prepareReply(${msg.id}, '${msg.author}', '${cleanText}')">↩</div>
          ${isOwn ? `<div class="msg-btn" onclick="prepareEdit(${msg.id}, '${cleanText}')">✏️</div>` : ""}
          ${isOwn ? `<div class="msg-btn" onclick="deleteMessage(${msg.id})">🗑️</div>` : ""}
        </div>
        <div class="msg-info">
          ${msg.author} • ${new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
          ${msg.is_edited ? '<span class="edited-mark">(изм.)</span>' : ""}
        </div>
        ${msg.reply_to_id ? `<div class="reply-quote" onclick="scrollToMessage(${msg.reply_to_id})">⤴ Ответ на сообщение</div>` : ""}
        <div class="msg-text">${text}</div>
      </div>`;

    method === "prepend" ? container.insertAdjacentHTML("afterbegin", msgHtml) : container.insertAdjacentHTML("beforeend", msgHtml);
  }

  function startRealtime() {
    client
      .channel("any")
      .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, (p) => {
        if (p.eventType === "DELETE") {
          const el = document.getElementById(`msg-${p.old.id}`);
          if (el) el.remove();
        } else {
          displayMessage(p.new, "prepend");
          // Звук только на входящие от других
          if (p.eventType === "INSERT" && p.new.author !== myNick) {
            playNotifSound();
          }
        }
      })
      .subscribe();
  }

  // Вспомогательные функции...
  function prepareReply(id, author, text) {
    cancelAllModes();
    replyId = id;
    showPreview(`Ответ ${author}: ${text.substring(0, 20)}...`);
  }
  function prepareEdit(id, text) {
    cancelAllModes();
    editingId = id;
    document.getElementById("msg-field").value = text;
    showPreview(`Редактирование...`);
  }
  function showPreview(text) {
    document.getElementById("reply-text").innerText = text;
    document.getElementById("reply-preview").style.display = "flex";
    document.getElementById("msg-field").focus();
  }
  function cancelAllModes() {
    replyId = null;
    editingId = null;
    document.getElementById("msg-field").value = "";
    document.getElementById("reply-preview").style.display = "none";
  }
  async function deleteMessage(id) {
    if (confirm("Удалить?")) await client.from("messages").delete().eq("id", id);
  }
  function scrollToMessage(id) {
    const el = document.getElementById(`msg-${id}`);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.style.background = "#444";
      setTimeout(() => (el.style.background = ""), 1500);
    }
  }
  async function loadHistory() {
    if (isLoadedAll) return;
    let query = client.from("messages").select("*").order("created_at", { ascending: false }).limit(40);
    if (lastTimestamp) query = query.lt("created_at", lastTimestamp);
    const { data } = await query;
    if (!data || data.length === 0) {
      isLoadedAll = true;
      return;
    }
    lastTimestamp = data[data.length - 1].created_at;
    data.forEach((msg) => displayMessage(msg, "append"));
  }
  function setupInfiniteScroll() {
    const container = document.getElementById("chat-messages");
    container.onscroll = () => {
      if (Math.abs(container.scrollTop) + container.clientHeight >= container.scrollHeight - 20) loadHistory();
    };
  }
  document.getElementById("msg-field").onkeypress = (e) => {
    if (e.key === "Enter") handleSend();
  };

  // Клик вне меню закрывает его
  window.onclick = function (event) {
    if (!event.target.matches("#mute-indicator")) {
      const menu = document.getElementById("settings-menu");
      if (menu && menu.style.display === "block") menu.style.display = "none";
    }
  };
</script>
