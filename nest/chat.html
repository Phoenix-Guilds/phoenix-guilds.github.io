<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
  /* Основной контейнер чата */
  #chat-wrapper {
    display: flex;
    flex-direction: column;
    height: 75vh; /* Высота чата — 75% экрана */
    min-height: 500px;
    background: #1a1d20;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden; /* Чтобы углы не вылезали */
    position: relative;
  }

  /* Врата авторизации (поверх всего) */
  #auth-gate {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 19, 0.98);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Область сообщений */
  #chat-messages {
    flex: 1; /* Занимает всё свободное место */
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column-reverse; /* Новые сообщения снизу */
    background-image: linear-gradient(rgba(15, 17, 19, 0.9), rgba(15, 17, 19, 0.9)), url("https://www.transparenttextures.com/patterns/dark-matter.png");
  }

  /* Стили пузырьков */
  .msg-bubble {
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: 14px;
    background: #2b3035;
    color: #eee;
    max-width: 80%;
    align-self: flex-start;
    position: relative;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
  }

  .msg-bubble.own {
    align-self: flex-end;
    background: #a9ffd0; /* Твой цвет */
    color: #0b2e13; /* Темный текст для контраста */
    border-bottom-right-radius: 4px;
  }

  .msg-bubble:not(.own) {
    border-bottom-left-radius: 4px;
    border-left: 3px solid #0dcaf0;
  }

  .msg-info {
    font-size: 0.7rem;
    font-weight: bold;
    margin-bottom: 4px;
    opacity: 0.7;
  }

  /* Фиксированная панель ввода снизу */
  #chat-input-area {
    flex-shrink: 0; /* Не сжимается */
    padding: 15px;
    background: #121416;
    border-top: 1px solid #333;
  }

  /* Кастомный скроллбар под стиль Nest */
  #chat-messages::-webkit-scrollbar {
    width: 6px;
  }
  #chat-messages::-webkit-scrollbar-track {
    background: transparent;
  }
  #chat-messages::-webkit-scrollbar-thumb {
    background: #333;
    border-radius: 10px;
  }

  .lock-icon {
    font-size: 0.7rem;
    margin-left: 5px;
    vertical-align: middle;
  }
</style>

<div class="container">
  <div class="main-content">
    <div id="chat-wrapper">
      <div id="auth-gate">
        <div class="p-4 text-center" style="max-width: 320px; width: 100%;">
          <h4 class="mb-3 text-white">Штабной канал</h4>
          <input type="text" id="user-nick" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="Ваш Ник" />
          <input type="password" id="secret-key" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Гильдейский пароль" />
          <button onclick="initChat()" class="btn btn-info w-100 fw-bold shadow-sm">Подключиться</button>
          <p class="small text-muted mt-3">E2EE шифрование активно <span class="lock-icon">🔒</span></p>
        </div>
      </div>

      <div id="chat-messages"></div>

      <div id="chat-input-area">
        <div class="input-group">
          <input type="text" id="msg-field" class="form-control bg-dark text-white border-secondary shadow-none" placeholder="Написать сообщение..." disabled />
          <button onclick="handleSend()" id="send-btn" class="btn btn-primary px-4 shadow-sm" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://aancnktkdjotjbtdjznw.supabase.co";
  const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbmNua3RrZGpvdGpidGRqem53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NTE3OTgsImV4cCI6MjA5MTQyNzc5OH0.ZPVyfehHS6KCTKthlc9hv2kzzQX-G28Z3JubWQpteKA";
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let myNick = "";
  let masterKey = "";
  let lastTimestamp = null;
  let isLoadedAll = false;

  // Инициализация (Твой исправленный алгоритм)
  async function initChat() {
    myNick = document.getElementById("user-nick").value.trim();
    const inputPass = document.getElementById("secret-key").value.trim();
    if (!myNick || !inputPass) return alert("Введите данные!");

    const { data: settings, error } = await client.from("chat_settings").select("*").single();
    if (error) return alert("Ошибка: Настройки чата не найдены в БД.");

    const loginHash = CryptoJS.SHA256(inputPass).toString();
    if (loginHash !== settings.password_hash) return alert("Неверный пароль!");

    try {
      const bytes = CryptoJS.AES.decrypt(settings.encrypted_master_key, inputPass);
      masterKey = bytes.toString(CryptoJS.enc.Utf8);
      if (!masterKey) throw new Error();
    } catch (e) {
      return alert("Критическая ошибка дешифровки!");
    }

    document.getElementById("auth-gate").style.display = "none";
    document.getElementById("msg-field").disabled = false;
    document.getElementById("send-btn").disabled = false;

    loadHistory();
    startRealtime();
    setupInfiniteScroll();
  }

  // Отправка
  async function handleSend() {
    const field = document.getElementById("msg-field");
    const text = field.value.trim();
    if (!text || !masterKey) return;

    const encrypted = CryptoJS.AES.encrypt(text, masterKey).toString();
    const { error } = await client.from("messages").insert([{ author: myNick, payload: encrypted }]);
    if (!error) field.value = "";
  }

  // Загрузка старых сообщений
  async function loadHistory() {
    if (isLoadedAll) return;
    let query = client.from("messages").select("*").order("created_at", { ascending: false }).limit(50);
    if (lastTimestamp) query = query.lt("created_at", lastTimestamp);

    const { data } = await query;
    if (!data || data.length === 0) {
      isLoadedAll = true;
      return;
    }
    lastTimestamp = data[data.length - 1].created_at;
    data.forEach((msg) => displayMessage(msg, "append"));
  }

  // Рендер и контроль памяти
  function displayMessage(msg, method = "prepend") {
    const container = document.getElementById("chat-messages");
    let decryptedText = "🔒 [Ошибка расшифровки]";
    try {
      const bytes = CryptoJS.AES.decrypt(msg.payload, masterKey);
      const decoded = bytes.toString(CryptoJS.enc.Utf8);
      if (decoded) decryptedText = decoded;
    } catch (e) {}

    const isOwn = msg.author === myNick;
    const msgHtml = `
      <div class="msg-bubble ${isOwn ? "own" : ""}">
        <div class="msg-info">${msg.author} • ${new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
        <div class="msg-text">${decryptedText}</div>
      </div>`;

    if (method === "prepend") {
      container.insertAdjacentHTML("afterbegin", msgHtml);
    } else {
      container.insertAdjacentHTML("beforeend", msgHtml);
    }

    // Очистка памяти: держим 100 сообщений в DOM
    if (container.children.length > 100 && method === "prepend") {
      container.removeChild(container.lastElementChild);
    }
  }

  function startRealtime() {
    client
      .channel("any")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => displayMessage(p.new, "prepend"))
      .subscribe();
  }

  function setupInfiniteScroll() {
    const container = document.getElementById("chat-messages");
    container.addEventListener("scroll", () => {
      // При column-reverse scrollTop отрицательный или ведет себя иначе в разных браузерах,
      // Math.abs помогает универсально определить близость к концу скролла (верху списка)
      if (Math.abs(container.scrollTop) + container.clientHeight >= container.scrollHeight - 10) {
        loadHistory();
      }
    });
  }

  // Обработка Enter
  document.getElementById("msg-field").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSend();
  });
</script>
