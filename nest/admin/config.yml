backend:
  name: github
  repo: Phoenix-Guilds/phoenix-guilds.github.io
  branch: main
  base_url: https://decap-cms-oauth-proxy.vercel.app
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "nest/assets/images/uploads"
public_folder: "/nest/assets/images/uploads"

markdown: kramdown

collections:
  - name: "guides"
    label: "Гайды"
    folder: "_guides"
    create: true

    slug: "{{slug}}"
    summary: '{{title}} — {{author}}' 
    image_field: thumbnail
    
    identifier_field: slug

    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "nest-guide" }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Автор", name: "author", widget: "string", default: "" }
      - { 
          label: "Обложка (для плитки в админке)", 
          name: "thumbnail", 
          widget: "image", 
          required: false,
          hint: "Эта картинка будет отображаться в сетке гайдов в админке" 
        }
      - { label: "Краткое описание", name: "description", widget: "text" }
      - { label: "Текст гайда", name: "body", widget: "markdown" }