<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>{{ page.title }} | Гильдия "Phoenix Nest" ("Гнездо Феникса", Sirus х5)</title>
    <link rel="shortcut icon" href="{{ '/nest/assets/images/favicon.ico' | relative_url }}" type="image/x-icon" />
    <!-- <title>{{ page.title }} | Phoenix Nest</title> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/nest/assets/vendors/FontAwesome/css/all.min.css' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/nest/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    {% include nest/header.html %}

    <main>
      {{ content }}
    </main>

    {% include nest/module-donations.html %} {% include nest/footer.html %}

    <button type="button" id="backToTop" class="btn btn-dark rounded-circle main-content shadow" title="Наверх"><i class="bi bi-arrow-up"></i> ↑</button>

    <script>
      const whTooltips = { colorLinks: true, iconizeLinks: true, renameLinks: true };

      document.addEventListener("DOMContentLoaded", function () {
        const backToTopBtn = document.getElementById("backToTop");

        // Следим за прокруткой
        window.addEventListener("scroll", function () {
          if (window.pageYOffset > 300) {
            backToTopBtn.classList.add("show");
          } else {
            backToTopBtn.classList.remove("show");
          }
        });

        // Логика клика
        backToTopBtn.addEventListener("click", function () {
          window.scrollTo({
            top: 0,
            behavior: "smooth", // Плавная прокрутка
          });
        });
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ '/nest/assets/vendors/FontAwesome/js/all.min.js' | relative_url }}"></script>
    <!-- <script src="https://wow.zamimg.com/js/tooltips.js"></script> -->
  </body>
</html>
