<div id="auth-gate">
  <div class="p-4 text-center" style="max-width: 320px; width: 100%;">
    <h4 class="mb-3 text-white">Чат гильдии</h4>
    <p id="chat-auth-description" class="small text-muted">Сначала подтвердите доступ общим паролем чата.</p>

    <form id="chat-room-auth-form">
      <label for="secret-key" class="visually-hidden">Общий пароль чата</label>
      <input type="password" id="secret-key" class="form-control mb-3 bg-dark text-white border-secondary" placeholder="Общий пароль чата" autocomplete="current-password" required />
      <button type="submit" class="btn btn-info w-100 fw-bold">Продолжить</button>
    </form>

    <form id="chat-user-auth-form" style="display: none;">
      <label for="user-nick" class="visually-hidden">Личный логин</label>
      <input type="text" id="user-nick" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="Личный логин" autocomplete="username" maxlength="40" required />
      <label for="user-password" class="visually-hidden">Личный пароль</label>
      <input type="password" id="user-password" class="form-control mb-2 bg-dark text-white border-secondary" placeholder="Личный пароль" autocomplete="current-password" required />
      <p class="small text-muted mb-2">Если аккаунта с таким логином еще нет, он будет создан автоматически.</p>
      <button type="submit" class="btn btn-info w-100 fw-bold">Войти</button>
      <button type="button" id="chat-auth-back" class="btn btn-outline-secondary w-100 mt-2">Назад</button>
    </form>

    <div id="chat-auth-error" class="small text-danger mt-2" role="alert" aria-live="polite"></div>
  </div>
</div>
