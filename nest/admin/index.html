<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager | Phoenix Nest</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/nest/admin/";
            });
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const netlifyUrl = "https://phoenix-guilds.netlify.app";

        if (localStorage.getItem("netlifySiteURL") !== netlifyUrl) {
          localStorage.setItem("netlifySiteURL", netlifyUrl);
        }
      });
    </script>
  </body>
</html>
