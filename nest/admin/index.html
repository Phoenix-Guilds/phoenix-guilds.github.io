<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager | Phoenix Nest</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/nest/admin/";
            });
          }
        });
      }

      window.CMS_CONFIG = {
        backend: {
          name: "git-gateway",
          address: "https://phoenix-guilds.netlify.app/.netlify/identity",
        },
      };
    </script>
  </body>
</html>
