<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content Manager | Phoenix Nest</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Этот скрипт связывает виджет с твоим Netlify
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/nest/admin/";
            });
          }
        });
      }

      // ВАЖНО: Если Identity не находит сайт, принудительно задаем API
      document.addEventListener("DOMContentLoaded", () => {
        if (window.localStorage.getItem("netlifySiteURL") === null) {
          window.localStorage.setItem("netlifySiteURL", "https://phoenix-guilds.netlify.app");
        }
      });
    </script>
  </body>
</html>
