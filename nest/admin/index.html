<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Content Manager | Phoenix Nest</title>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      window.addEventListener(
        "message",
        (event) => {
          if (event.origin === "https://decap-cms-oauth-proxy.vercel.app") {
            console.log("Сигнал получен, обрабатываем токен...");

            if (event.data && event.data.includes("success")) {
              const jsonStr = event.data.replace("authorization:github:success:", "");
              try {
                const data = JSON.parse(jsonStr);
                if (data.token) {
                  const user = {
                    backendName: "github",
                    token: data.token,
                    provider: "github",
                  };
                  localStorage.setItem("decap-cms-user", JSON.stringify(user));
                  localStorage.setItem("netlify-cms-user", JSON.stringify(user));

                  console.log("Токен сохранен! Перезагрузка...");
                  setTimeout(() => {
                    window.location.reload();
                  }, 500);
                }
              } catch (e) {
                console.error("Ошибка парсинга токена:", e);
              }
            }
          }
        },
        false,
      );

      const translit = (str) => {
        const ru = {
          а: "a",
          б: "b",
          в: "v",
          г: "g",
          д: "d",
          е: "e",
          ё: "yo",
          ж: "zh",
          з: "z",
          и: "i",
          й: "y",
          к: "k",
          л: "l",
          м: "m",
          н: "n",
          о: "o",
          п: "p",
          р: "r",
          с: "s",
          т: "t",
          у: "u",
          ф: "f",
          х: "h",
          ц: "c",
          ч: "ch",
          ш: "sh",
          щ: "sch",
          ъ: "",
          ы: "y",
          ь: "",
          э: "e",
          ю: "yu",
          я: "ya",
        };

        return str
          .toLowerCase()
          .split("")
          .map((c) => (ru[c] !== undefined ? ru[c] : c))
          .join("")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      };

      const AutoSlugControl = createClass({
        handleChange: function (e) {
          const value = e.target.value;
          this.props.onChange(value);

          const slugValue = translit(value);

          const slugField = document.querySelector('[name="slug"]');
          if (slugField) {
            slugField.value = slugValue;
            slugField.dispatchEvent(new Event("input", { bubbles: true }));
          }
        },

        render: function () {
          return h("input", {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            type: "text",
            value: this.props.value || "",
            onChange: this.handleChange,
          });
        },
      });

      CMS.registerWidget("slugger", AutoSlugControl);
    </script>
  </body>
</html>
